<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //Function Generator Sederhana
      function* createNames() {
        yield "Joko";
        yield "Romo";
        yield "Agustin";
      }
      const names = createNames();
      for (const name of names) {
        document.writeln(name);
      }
      document.writeln("<br>");
      //Function Generator  Kompleks
      function* buatGanjil(value) {
        for (let i = 1; i < value; i++) {
          if (i % 2 === 1) {
            document.writeln(`Yield ${i}`)
            yield i;
          }
        }
      }
    //   const angkaGanjil = buatGanjil(100);
    //   for (const angka of angkaGanjil) {
    //     document.writeln(angka);
    //   }

    //LAZY 
    const numbers = buatGanjil(100) 
    document.writeln(numbers.next().value)
    document.writeln(numbers.next().value)
    document.writeln(numbers.next().value)
    </script>
  </body>
</html>
