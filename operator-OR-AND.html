<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //OR
        console.info("Hello"|| ``)
        document.writeln("Hello"|| ``)
        
        console.info(""|| [])
        document.writeln(""|| [])

        console.info("0"|| "NOL")
        document.writeln ("0"|| "NOL")

        console.info(0|| "NOL")
        document.writeln(0|| "NOL")

        console.info(null|| "null")
        document.writeln(null|| "null")

        console.info(undefined|| "UNDEFINED")
        document.writeln(undefined|| "UNDEFINED")
         document.writeln("<br>")
        //AND
         console.info("Hello"&&``)
        document.writeln("Hello"&& ``)
        
        console.info(""&&  [])
        document.writeln(""&&  [])

        console.info("0"&& "NOL")
        document.writeln ("0"&& "NOL")

        console.info(0 &&  "NOL")
        document.writeln(0 &&  "NOL")

        console.info(null &&  "null")
        document.writeln(null &&  "null")

        console.info(undefined &&  "UNDEFINED")
        document.writeln(undefined && "UNDEFINED")
   </script>
</body>
</html>
