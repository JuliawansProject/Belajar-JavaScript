<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var i = 20;
      for (var i = 0; i < 10; i++) {
        //local
        console.log(`local : ${i}`);
        document.writeln(`local : ${i}`);
      }
      console.log(`Global : ${i}`);
      document.writeln(`Global : ${i}`);
    </script>
  </body>
</html>
